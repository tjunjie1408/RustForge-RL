[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
# Distribution name on PyPI; the import name stays `rustforge`.
name = "rustforge-rl"
# The version comes from the Cargo workspace so there is a single source of truth.
dynamic = ["version"]
description = "Reinforcement learning environments and agents implemented in Rust, with Gymnasium-compatible Python bindings"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
# Copies of the repository-root license files (PEP 639 requires paths inside this directory).
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Teo Jun Jie" }]
keywords = ["reinforcement-learning", "rust", "gymnasium", "dqn", "pyo3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
gym = ["gymnasium>=0.29"]
test = ["pytest>=7", "gymnasium>=0.29", "numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/tjunjie1408/RustForge-RL"
Repository = "https://github.com/tjunjie1408/RustForge-RL"
Issues = "https://github.com/tjunjie1408/RustForge-RL/issues"
Changelog = "https://github.com/tjunjie1408/RustForge-RL/blob/master/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "rustforge._core"
# abi3-py39: one wheel per platform covers every CPython >= 3.9.
features = ["pyo3/extension-module", "pyo3/abi3-py39"]
# Never ship local bytecode caches.
exclude = ["**/__pycache__/**", "**/*.pyc"]
