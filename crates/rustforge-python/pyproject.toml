[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "rustforge"
version = "0.1.0"
description = "Python bindings for the RustForge RL framework"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
gym = ["gymnasium>=0.29"]
test = ["pytest>=7", "gymnasium>=0.29", "numpy>=1.21"]

[tool.maturin]
python-source = "python"
module-name = "rustforge._core"
features = ["pyo3/extension-module"]
