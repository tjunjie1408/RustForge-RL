[package]
name = "rustforge-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Ratatui terminal console for monitoring RustForge RL training"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde = { workspace = true }
serde_json = "1"
anyhow = { workspace = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
# Ratatui's LRU 0.18 requirement also permits releases with RUSTSEC-2026-0253.
lru = "0.18.2"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
sysinfo = { version = "=0.35.2", default-features = false, features = ["system"] }
rustforge-rl = { path = "../rustforge-rl" }
crossbeam-channel = "0.5"

[dev-dependencies]
