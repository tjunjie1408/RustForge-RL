[package]
name = "rustforge-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde = { workspace = true }
anyhow = "1"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# Ratatui 0.29 permits newer 0.3.x releases whose MSRV exceeds this workspace's 1.75.
instability = "=0.3.10"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
sysinfo = { version = "=0.35.2", default-features = false, features = ["system"] }
rustforge-rl = { path = "../rustforge-rl" }
crossbeam-channel = "0.5"

[dev-dependencies]
