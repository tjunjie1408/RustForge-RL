[package]
name = "rustforge-rl"
description = "Reinforcement learning algorithms for RustForge RL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
gpu = ["dep:bincode", "rustforge-nn/gpu", "rustforge-autograd/gpu", "rustforge-tensor/gpu"]

[[example]]
name = "gpu_dqn_checkpoint"
required-features = ["gpu"]

[[example]]
name = "gpu_dqn_training"
required-features = ["gpu"]

[[example]]
name = "gpu_ppo_objective"
required-features = ["gpu"]

[[example]]
name = "gpu_ppo_training"
required-features = ["gpu"]

[[example]]
name = "gpu_continuous_ppo_objective"
required-features = ["gpu"]

[[example]]
name = "gpu_continuous_ppo_training"
required-features = ["gpu"]

[[example]]
name = "gpu_a2c_objective"
required-features = ["gpu"]

[[example]]
name = "gpu_a2c_training"
required-features = ["gpu"]

[[example]]
name = "gpu_reinforce_objective"
required-features = ["gpu"]

[[example]]
name = "gpu_reinforce_training"
required-features = ["gpu"]

[[example]]
name = "gpu_td3_objective"
required-features = ["gpu"]

[dependencies]
bincode = { workspace = true, optional = true }
rustforge-tensor = { path = "../rustforge-tensor" }
rustforge-autograd = { path = "../rustforge-autograd" }
rustforge-nn = { path = "../rustforge-nn" }
ndarray = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
smallvec = { workspace = true }
crossbeam-channel = "0.5"
serde_json = "1"

[dev-dependencies]
proptest = { workspace = true }
approx = { workspace = true }
tempfile = "3"
