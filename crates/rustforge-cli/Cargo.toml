[package]
name = "rustforge-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line trainer and terminal training console for RustForge RL"

[features]
default = []
gpu = ["rustforge-rl/gpu"]

[dependencies]
serde_json = "1"
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
rustforge-autograd = { path = "../rustforge-autograd" }
rustforge-tensor = { path = "../rustforge-tensor" }
rustforge-nn = { path = "../rustforge-nn" }
rustforge-rl = { path = "../rustforge-rl" }
rustforge-tui = { path = "../rustforge-tui" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "rustforge"
path = "src/main.rs"
