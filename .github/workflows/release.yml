name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'scripts/check_cli_artifact.py', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other platforms if one fails — avoids a partial release.
      fail-fast: false
      matrix:
        include:
          # The binary target is `rustforge` (see crates/rustforge-cli/Cargo.toml).
          - os: ubuntu-latest
            artifact: rustforge-linux-x86_64
            bin: target/release/rustforge
          - os: macos-latest
            # macos-latest runners are arm64 (macos-14+).
            artifact: rustforge-macos-arm64
            bin: target/release/rustforge
          - os: windows-latest
            artifact: rustforge-windows-x86_64.exe
            bin: target/release/rustforge.exe

    steps:
    - uses: actions/checkout@v5

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build CLI (release)
      run: cargo build --release --locked -p rustforge-cli --bin rustforge --features gpu

    # Give each platform's binary a distinct, descriptive name so the three
    # matrix jobs don't overwrite each other's asset on the release.
    - name: Rename artifact
      shell: bash
      run: cp "${{ matrix.bin }}" "${{ matrix.artifact }}"

    - name: Test renamed artifact
      run: python scripts/check_cli_artifact.py "${{ matrix.artifact }}"

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.artifact }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
