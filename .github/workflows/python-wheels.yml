name: Python wheels

# Builds abi3 wheels (one per platform, CPython >= 3.9) and an sdist for the
# `rustforge-rl` PyPI package.
#
# - Pull requests touching Rust or packaging: build + test only.
# - `v*` tags: build, test, then publish to PyPI via Trusted Publishing.
# - Manual run: build + test, optionally publish to TestPyPI.
#
# Publishing needs a one-time Trusted Publisher setup on (Test)PyPI for this
# repository, workflow file `python-wheels.yml`, and environment `pypi` /
# `testpypi`. No API token is stored in the repository.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch:
    inputs:
      publish-testpypi:
        description: "Upload the built distributions to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheel (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64 }
          # One universal2 wheel serves both Apple Silicon and Intel Macs.
          - { name: macos-universal2, runner: macos-latest, target: universal2-apple-darwin }
          - { name: windows-x86_64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: auto
          working-directory: crates/rustforge-python
          args: --release --locked --out dist

      - name: Test the installed wheel
        shell: bash
        working-directory: crates/rustforge-python
        run: |
          python -m pip install dist/*.whl pytest "gymnasium>=0.29"
          python -m pytest -q tests -p no:cacheprovider

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: crates/rustforge-python/dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json, sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'rustforge-python'))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: crates/rustforge-python
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/rustforge-python/dist

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rustforge-rl/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish-testpypi
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/rustforge-rl/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
