name: CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Least-privilege: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and lints are platform-independent — run them once on Linux
  # instead of repeating across the test matrix.
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features --exclude rustforge-python -- -D warnings

  # Keep the declared `rust-version` honest. Cargo.lock stays at format v3 and
  # .cargo/config.toml makes dependency resolution prefer MSRV-compatible versions.
  msrv:
    name: MSRV (Rust 1.75)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@1.75

    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2

    - name: Check workspace on the declared MSRV
      run: cargo check --workspace --all-targets --all-features --locked --exclude rustforge-python

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "v2-arm64-fix"

    - name: Run tests
      run: cargo test --workspace --all-features --exclude rustforge-python

  python-bindings:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (bindings)
        run: cargo clippy -p rustforge-python --features extension-module -- -D warnings

      - name: Build, install & test
        working-directory: crates/rustforge-python
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin>=1.9,<2.0" pytest "gymnasium>=0.29" "numpy>=1.21"
          maturin develop
          pytest -v

  gpu:
    name: GPU shader parity (software Vulkan)
    runs-on: ubuntu-latest
    env:
      XDG_RUNTIME_DIR: /tmp/rustforge-xdg
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - name: Run adapter-required numerical parity tests
        run: cargo test --locked -p rustforge-tensor --features gpu --test gpu_matmul -- --include-ignored --nocapture
      - name: Verify device buffer reuse without intermediate transfers
        run: cargo test --locked -p rustforge-tensor --features gpu --lib gpu::tests::persistent_operations_avoid_transfers_and_reuse_storage -- --include-ignored
      - name: Run GPU example
        run: cargo run --locked -p rustforge-tensor --features gpu --example gpu_matmul
      - name: Verify GPU autograd, momentum SGD and Adam
        run: cargo test --locked -p rustforge-autograd --features gpu --test gpu_autograd -- --include-ignored
      - name: Verify GPU graph lifetime
        run: cargo test --locked -p rustforge-autograd --features gpu --lib gpu::tests -- --include-ignored
      - name: Run deterministic GPU training
        run: cargo run --locked -p rustforge-autograd --features gpu --example gpu_training
      - name: Verify GPU neural-network modules and CPU training parity
        run: cargo test --locked -p rustforge-nn --features gpu --test gpu_modules -- --include-ignored
      - name: Run seeded GPU MLP with Adam
        run: cargo run --locked -p rustforge-nn --features gpu --example gpu_mlp_training
      - name: Verify GPU DQN targets, updates and RL convergence
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_dqn -- --include-ignored
      - name: Run seeded GPU Double DQN environment example
        run: cargo run --locked -p rustforge-rl --features gpu --example gpu_dqn_training
      - name: Verify GPU DQN checkpoint rollback and exact resume
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_checkpoint -- --include-ignored
      - name: Run GPU checkpoint and resume example
        run: cargo run --locked -p rustforge-rl --features gpu --example gpu_dqn_checkpoint -- "$RUNNER_TEMP/gpu-dqn-resume.chk"
      - name: Verify GPU runtime worker ownership, resume and controls
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_runtime -- --include-ignored
      - name: Verify GPU CLI checkpoint routing and CSV/JSONL compatibility
        run: cargo test --locked -p rustforge-cli --features gpu --test device_selection -- --include-ignored
      - name: Verify GPU PPO categorical losses and gradients
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_ppo_loss -- --include-ignored
      - name: Run fixed GPU PPO objective example
        run: cargo run --locked -p rustforge-rl --features gpu --example gpu_ppo_objective
      - name: GPU PPO agent and environment rollouts
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_ppo_agent -- --include-ignored
      - name: Verify GPU PPO checkpoint codec without adapter allocation
        run: cargo test --locked -p rustforge-rl --features gpu --lib gpu_ppo::agent::checkpoint
      - name: GPU PPO checkpoint and runtime resume/controls
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_ppo_checkpoint --test gpu_ppo_runtime -- --include-ignored
      - name: GPU PPO environment learning example
        run: cargo run --locked -p rustforge-rl --features gpu --example gpu_ppo_training
      - name: Verify Gaussian operators and continuous PPO objective parity
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_continuous_ppo -- --include-ignored
      - name: Optimize fixed continuous GPU PPO minibatch
        run: cargo run --locked -p rustforge-rl --features gpu --example gpu_continuous_ppo_objective
      - name: Verify continuous GPU PPO agent sampling, rollout and updates
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_continuous_agent -- --include-ignored
      - name: Learn continuous target action from environment rollouts
        run: cargo run --locked -p rustforge-rl --features gpu --example gpu_continuous_ppo_training
      - name: Verify continuous PPO checkpoint codec without adapter allocation
        run: cargo test --locked -p rustforge-rl --features gpu --lib gpu_ppo::continuous_agent::checkpoint
      - name: Verify continuous GPU PPO checkpoint and runtime resume/controls
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_continuous_checkpoint --test gpu_continuous_runtime -- --include-ignored
      - name: Verify GPU A2C objectives, gradients and actual CPU Adam parity
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_a2c_loss -- --include-ignored
      - name: Optimize fixed GPU A2C objective
        run: cargo run --locked -p rustforge-rl --features gpu --example gpu_a2c_objective
      - name: Verify GPU A2C agent sampling, rollout/GAE and guarded updates
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_a2c_agent -- --include-ignored
      - name: Learn rewarding categorical action with GPU A2C
        run: cargo run --locked -p rustforge-rl --features gpu --example gpu_a2c_training
      - name: Verify GPU A2C checkpoint codec without adapter allocation
        run: cargo test --locked -p rustforge-rl --features gpu --lib gpu_a2c::agent::checkpoint
      - name: Verify GPU A2C checkpoint/runtime resume and control handling
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_a2c_checkpoint --test gpu_a2c_runtime -- --include-ignored
      - name: Verify GPU REINFORCE objective and actual CPU Adam parity
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_reinforce_loss -- --include-ignored
      - name: Optimize fixed GPU REINFORCE objective
        run: cargo run --locked -p rustforge-rl --features gpu --example gpu_reinforce_objective
      - name: Verify GPU REINFORCE agent Monte Carlo rollouts and guarded updates
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_reinforce_agent -- --include-ignored
      - name: Learn rewarding action from GPU REINFORCE rollouts
        run: cargo run --locked -p rustforge-rl --features gpu --example gpu_reinforce_training
      - name: Verify GPU REINFORCE checkpoint codec without adapter allocation
        run: cargo test --locked -p rustforge-rl --features gpu --lib gpu_reinforce::agent::checkpoint
      - name: Verify GPU REINFORCE checkpoint/runtime continuation and controls
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_reinforce_checkpoint --test gpu_reinforce_runtime -- --include-ignored
      - name: Verify GPU TD3 objectives, action smoothing and CPU Adam parity
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_td3_loss -- --include-ignored
      - name: Optimize fixed GPU TD3 twin-critic objective
        run: cargo run --locked -p rustforge-rl --features gpu --example gpu_td3_objective
      - name: Verify GPU TD3 replay, seeded CPU parity and delayed updates
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_td3_agent -- --include-ignored
      - name: Learn fresh continuous episodes with GPU TD3
        run: cargo run --locked -p rustforge-rl --features gpu --example gpu_td3_training
      - name: Validate GPU TD3 checkpoint format and host metadata
        run: cargo test --locked -p rustforge-rl --features gpu --lib gpu_td3::agent::checkpoint
      - name: Verify GPU TD3 checkpoint continuation and runtime controls
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_td3_checkpoint --test gpu_td3_runtime -- --include-ignored
      - name: Verify GPU TD3 Pendulum CLI resume
        run: cargo test --locked -p rustforge-cli --features gpu --test device_selection gpu_td3_pendulum_cli -- --include-ignored
      - name: Verify GPU SAC sampling, objectives and CPU Adam parity
        run: cargo test --locked -p rustforge-rl --features gpu --test gpu_sac_loss -- --include-ignored
      - name: Optimize fixed GPU SAC twin-critic objective
        run: cargo run --locked -p rustforge-rl --features gpu --example gpu_sac_objective
      - name: Verify GPU SAC Pendulum CLI resume and temperature clock
        run: cargo test --locked -p rustforge-cli --features gpu --test device_selection gpu_sac_pendulum_cli -- --include-ignored
