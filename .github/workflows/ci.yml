name: CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Least-privilege: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and lints are platform-independent — run them once on Linux
  # instead of repeating across the test matrix.
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features --exclude rustforge-python -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "v2-arm64-fix"

    - name: Run tests
      run: cargo test --workspace --all-features --exclude rustforge-python

  python-bindings:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (bindings)
        run: cargo clippy -p rustforge-python --features extension-module -- -D warnings

      - name: Build, install & test
        working-directory: crates/rustforge-python
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin>=1.7,<2.0" pytest "gymnasium>=0.29" "numpy>=1.21"
          maturin develop
          pytest -v
